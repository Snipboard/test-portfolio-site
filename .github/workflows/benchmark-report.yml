# Trusted post-CI reporting. Runs only from the default branch after CI;
# never checks out or executes fork PR code with the comment-write token.
name: Benchmark PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    uses: affank1020/benchmark/.github/workflows/reusable-report.yml@bb128d710834af8f763eb116bfd768af9d326d9b
    with:
      artifact_name: benchmark-ci
